<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- subtle top highlight -->
  <rect x="0" y="0" width="1280" height="2" fill="#1E293B"/>

  <!-- accent wave line -->
  <path d="M0 78 C 220 48, 420 108, 640 78 S 1060 48, 1280 78" fill="none" stroke="url(#line)" stroke-width="2"/>

  <!-- name -->
  <text x="640" y="168" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="0.5">Hasanur Rahman Kabir</text>

  <!-- thin divider -->
  <rect x="470" y="198" width="340" height="1.5" fill="#334155"/>

  <!-- title -->
  <text x="640" y="242" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Software Engineer</text>

  <!-- bottom accent -->
  <path d="M0 300 C 220 330, 420 270, 640 300 S 1060 330, 1280 300" fill="none" stroke="url(#line)" stroke-width="1.5" opacity="0.7"/>
</svg>
